<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear rostro de partículas</title>
<style>
  body { margin: 0; padding: 28px; background: #0b0e14; color: #cfe3ff; font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 6px 0; color: #9db6d6; max-width: 640px; }
  ol { color: #9db6d6; max-width: 640px; padding-left: 20px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 18px; align-items: flex-start; }
  canvas { background: #000; border: 1px solid #223; border-radius: 8px; max-width: 100%; }
  label { display: block; margin: 12px 0 2px; font-size: 13px; color: #9db6d6; }
  input[type=range] { width: 240px; }
  button, .btn { display: inline-block; margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #1f66ff; color: #fff; font: 600 14px system-ui; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #msg { margin-top: 10px; color: #8fdcff; }
</style>
</head>
<body>
  <h1>Crear rostro de partículas</h1>
  <p>Convierte una foto en el archivo <b>js/rostro-data.js</b> que usa la animación.</p>
  <ol>
    <li>Elige una foto de frente, con fondo liso y claro (cabeza y hombros).</li>
    <li>Ajusta el contraste si hace falta.</li>
    <li>Descarga <b>rostro-data.js</b> y reemplaza el que está en la carpeta <b>js/</b>.</li>
  </ol>

  <input type="file" id="file" accept="image/*">

  <div class="row">
    <div>
      <canvas id="prev" width="340" height="484"></canvas>
    </div>
    <div>
      <label>Contraste de detalles (ojos, cejas, labios): <span id="vC">1.0</span></label>
      <input type="range" id="c" min="0" max="2.5" step="0.1" value="1">
      <label>Sensibilidad al fondo: <span id="vU">1.0</span></label>
      <input type="range" id="u" min="0.5" max="2" step="0.1" value="1">
      <br><button id="dl" disabled>Descargar rostro-data.js</button>
      <div id="msg"></div>
    </div>
  </div>

<script src="procesar-rostro.js"></script>
<script>
  var cv = document.getElementById('prev'), cx = cv.getContext('2d');
  var fileEl = document.getElementById('file'), cEl = document.getElementById('c'), uEl = document.getElementById('u');
  var dl = document.getElementById('dl'), msg = document.getElementById('msg');
  var src = null, result = null, timer = 0;

  fileEl.addEventListener('change', function () {
    var f = fileEl.files[0]; if (!f) return;
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      var g = c.getContext('2d'); g.drawImage(img, 0, 0);
      src = g.getImageData(0, 0, c.width, c.height);
      run();
    };
    img.src = URL.createObjectURL(f);
  });
  [cEl, uEl].forEach(function (el) {
    el.addEventListener('input', function () {
      document.getElementById('vC').textContent = (+cEl.value).toFixed(1);
      document.getElementById('vU').textContent = (+uEl.value).toFixed(1);
      clearTimeout(timer); timer = setTimeout(run, 150);
    });
  });

  function run() {
    if (!src) return;
    msg.textContent = 'Procesando…';
    setTimeout(function () {
      try {
        result = RostroTools.procesarRostro(src.data, src.width, src.height, { contraste: +cEl.value, umbral: +uEl.value });
      } catch (e) { msg.textContent = 'No se pudo procesar esa foto: ' + e.message; return; }
      var r = result, k = Math.min(cv.width / r.w, cv.height / r.h);
      cx.fillStyle = '#000'; cx.fillRect(0, 0, cv.width, cv.height);
      var tmp = document.createElement('canvas'); tmp.width = r.w; tmp.height = r.h;
      var tg = tmp.getContext('2d'), id = tg.createImageData(r.w, r.h);
      for (var i = 0; i < r.w * r.h; i++) {
        var al = r.data[i * 4 + 3] / 255;
        id.data[i * 4] = r.data[i * 4] * al; id.data[i * 4 + 1] = r.data[i * 4 + 1] * al; id.data[i * 4 + 2] = r.data[i * 4 + 2] * al; id.data[i * 4 + 3] = 255;
      }
      tg.putImageData(id, 0, 0);
      cx.imageSmoothingEnabled = true;
      cx.drawImage(tmp, 0, 0, r.w * k, r.h * k);
      dl.disabled = false; msg.textContent = 'Listo. Así se verá: color real, y más partículas donde hay más luz.';
    }, 20);
  }

  dl.addEventListener('click', function () {
    if (!result) return;
    var txt = '/* Datos del rostro (generado con herramientas/crear-rostro.html). No hace falta tocarlo. */\n' +
      'window.ROSTRO_DATA = {\n  w: ' + result.w + ', h: ' + result.h + ', aspect: ' + result.aspect.toFixed(4) + ',\n  data: "' + result.base64 + '"\n};\n';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/javascript' }));
    a.download = 'rostro-data.js'; document.body.appendChild(a); a.click(); a.remove();
  });
</script>
</body>
</html>
